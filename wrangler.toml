# ============================================================
# ACERVO DIGITAL - Configuração Cloudflare Workers
# Sociedade Filarmônica 25 de Março
# ============================================================

name = "acervo-filarmonica-api"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Banco de dados D1
[[d1_databases]]
binding = "DB"
database_name = "acervo-db"
database_id = "2e8dc4fb-4f78-45fe-9e07-dcd05ea60d8c"
migrations_dir = "database/migrations"

# Bucket R2 para PDFs
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "acervo-pdfs"

# Rate limiting nativo do Cloudflare Workers
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "25032601"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "CHECK_USER_RATE_LIMITER"
namespace_id = "25032602"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "TRACKING_RATE_LIMITER"
namespace_id = "25032603"
  [ratelimits.simple]
  limit = 100
  period = 60

# Variáveis de ambiente
[vars]
ENVIRONMENT = "production"
POSTHOG_HOST = "https://us.i.posthog.com"
# JWT_SECRET is set as a secret via: npx wrangler secret put JWT_SECRET
# POSTHOG_API_KEY is set as a secret via: npx wrangler secret put POSTHOG_API_KEY

# ============================================================
# COMANDOS ÚTEIS
# ============================================================
#
# Deploy da API:
#    npx wrangler deploy
#
# Deploy do Frontend:
#    npx wrangler pages deploy frontend --project-name=acervo-filarmonica --branch=main --commit-dirty=true
#
# Ver logs em tempo real:
#    npx wrangler tail acervo-filarmonica-api
#
# Executar SQL no banco:
#    npx wrangler d1 execute acervo-db --remote --command="SELECT * FROM usuarios"
#
# ============================================================
